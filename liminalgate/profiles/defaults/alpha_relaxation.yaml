name: alpha_relaxation
description: Alpha 8–12 Hz against SMR and beta. The tone follows relative alpha and fades when beta dominates.
relative_range: [1.0, 45.0]
window_sec: 4.0
hop_sec: 0.25
bands:
  - {name: theta, f_low: 4.0, f_high: 8.0, color: "#7aa2ff"}
  - {name: alpha, f_low: 8.0, f_high: 12.0, color: "#5dcaa5"}
  - {name: smr, f_low: 12.0, f_high: 15.0, color: "#8fd18a"}
  - {name: beta, f_low: 15.0, f_high: 30.0, color: "#e0b15a"}
ratios:
  - {name: alpha_over_beta, expression: alpha/beta}
  - {name: alpha_over_theta, expression: alpha/theta}
markers:
  - {name: relax, color: "#5dcaa5", hotkey: r, osc: null}
  - {name: vibracije, color: "#7aa2ff", hotkey: "1", osc: 1}
  - {name: "puls tijela", color: "#5dcaa5", hotkey: "2", osc: 2}
  - {name: izlazak, color: "#e0b15a", hotkey: "3", osc: 3}
  - {name: budjenje, color: "#e07a8a", hotkey: "4", osc: 4}
  - {name: ostalo, color: "#c4b5fd", hotkey: "5", osc: 5}
feedback:
  - metric: alpha
    source: relative
    scope: mean
    param: volume
    in_min: 0.05
    in_max: 0.45
    out_min: 0.0
    out_max: 0.8
    smooth: 0.3
    gate_metric: beta
    gate_source: relative
    gate_threshold: 0.35
    gate_mode: mute_above
  - metric: alpha
    source: relative
    scope: mean
    param: frequency
    in_min: 0.05
    in_max: 0.45
    out_min: 200
    out_max: 460
    smooth: 0.3
    gate_mode: none
